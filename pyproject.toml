[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-default-risk-model"
version = "0.1.0"
description = "Calibrated credit-default probability model with cost and fairness diagnostics"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
credit-risk-train = "credit_default_risk_model.train:main"
credit-risk-evaluate = "credit_default_risk_model.evaluate:main"
credit-risk-predict = "credit_default_risk_model.predict:main"
credit-risk-smoke-data = "credit_default_risk_model.data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
